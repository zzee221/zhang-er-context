# 纯静态站点：构建 = 扫描 md + 解析封面 + 生成 posts/*.json
[build]
  command = "node scripts/build.mjs"
  publish = "."

# 数据文件不缓存，保证每次部署后浏览器拿到最新结果
[[headers]]
  for = "/posts/index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/covers-resolved.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/covers/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/posts/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
